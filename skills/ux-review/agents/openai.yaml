interface:
  display_name: "UX Review"
  short_description: "Review product vision, journeys, UI and visual quality"
  default_prompt: "Use $ux-review to evaluate the requested scope from product intent and blueprint through real journeys, interaction and visual quality. For visual acceptance, inspect full rendered states, measure the component's actual content lane and control allocation, and operate ambiguous controls to verify their effects; viewport sweeps or source inspection alone are not a pass. Maintain project UX documentation for a full review, distinguish evidence from assumptions, and implement only when authorized."
policy:
  allow_implicit_invocation: true
