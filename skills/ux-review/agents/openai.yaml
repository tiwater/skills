interface:
  display_name: "UX Review"
  short_description: "Review and craft product UX, landing pages, docs and UI systems"
  default_prompt: "Use $ux-review to evaluate or design the requested scope from product intent, surface mode (Operate, Read, Persuade, Experience) and blueprint through real journeys, interaction, anti-slop craft and visual quality. For visual acceptance, inspect full rendered states, measure the component's actual content lane and control allocation, and operate ambiguous controls to verify their effects; viewport sweeps or source inspection alone are not a pass. Maintain project UX documentation for a full review, distinguish evidence from assumptions, and implement only when authorized."
policy:
  allow_implicit_invocation: true
